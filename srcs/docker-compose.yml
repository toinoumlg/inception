services:
  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    secrets:
      - db_user_pwd
      - db_root_pwd
    volumes:
      - mariadb-data:/var/lib/mariadb
    restart: unless-stopped
    networks:
      - shared
    environment:
      PORT: ${MYSQL_PORT}
      DB_NAME: ${MYSQL_NAME}
      LOGIN: ${LOGIN}

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    secrets:
      - db_user_pwd
      - wp_admin_pwd
      - wp_login_pwd
    volumes:
      - wordpress-data:/var/www/wordpress
    networks:
      - shared
    environment:
      DB_HOST: mariadb
      DB_NAME: ${MYSQL_NAME}
      DB_PORT: ${MYSQL_PORT}
      ADMIN_NAME: ${WP_ADMIN_NAME}
      ADMIN_MAIL: ${WP_ADMIN_MAIL}
      LOGIN: ${LOGIN}
      LOGIN_MAIL: ${WP_USER_MAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_PORT: ${WP_PORT}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    container_name: nginx
    build: requirements/nginx/
    volumes:
      - wordpress-data:/var/www/wordpress:ro
    networks:
      - shared
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      NGINX_PORT: ${NGINX_PORT}
      WP_PORT: ${WP_PORT}
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
    depends_on:
      wordpress:
        condition: service_healthy
    restart: unless-stopped

  # ft_irc:
  #   container_name: ft_irc
  #   build: requirements/ft_irc
  #   networks: 
  #     - shared
  #   healthcheck:
  #     test: ["CMD", "nc", "-z", "127.0.0.1:4432"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 2s

secrets:
  db_user_pwd:
    file: ${DB_USER_PWD}
  db_root_pwd:
    file: ${DB_ROOT_PWD}
  wp_admin_pwd:
    file: ${WP_ADMIN_PWD}
  wp_login_pwd:
    file: ${WP_LOGIN_PWD}

volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/mariadb
  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/wordpress

networks:
  shared:
    driver: bridge
